name: omniarcadia
description: A new Flutter project.

publish_to: 'none' # Remove this line if you are publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.5.1
  audioplayers: ^0.20.1 # Asegúrate de tener esta dependencia
  just_audio: ^0.9.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/music/afterdark_8bit.mp3
    - assets/video/Omni.mp4
    - assets/images/   # Carga toda la carpeta de imágenes
    - assets/images/OmniArcadia.png
    - assets/images/A.png
    - assets/images/B.png
    - assets/images/C.png
    - assets/images/D.png
    - assets/sounds/flip_card.mp3
    - assets/sounds/correct_match.mp3
    - assets/sounds/win_game.mp3
